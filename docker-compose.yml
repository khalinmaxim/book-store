version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: bookstore
      PGUSER: app
      PGPASSWORD: app
      TZ: Europe/Warsaw
    volumes:
      - ./migrations:/migrations:ro
      - ./migrator:/migrator:ro
    entrypoint: [ "bash", "/migrator/entrypoint.sh" ]
    restart: "no"


  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      TZ: Europe/Moscow
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bookstore
      DB_USER: app
      DB_PASS: app
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "no-reply@bookstore.local"
      SMTP_FROM_NAME: "Bookstore"
      APP_URL: "http://localhost:8080"
    volumes:
      - ./src:/var/www/html
    ports:
      - "8080:80"
    command: ["bash","-lc","cd /var/www/html && [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist; apache2-foreground"]

  scheduler:
    build: .
    depends_on:
      web:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    environment:
      TZ: Europe/Moscow
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bookstore
      DB_USER: app
      DB_PASS: app
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "no-reply@bookstore.local"
      SMTP_FROM_NAME: "Bookstore"
      APP_URL: "http://localhost:8080"
    volumes:
      - ./src:/var/www/html
      - ./crontab:/etc/cron.d/app-cron:ro
    command: ["bash","-lc","cd /var/www/html && [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist; chmod 0644 /etc/cron.d/app-cron && touch /var/log/cron.log && cron -f"]

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
